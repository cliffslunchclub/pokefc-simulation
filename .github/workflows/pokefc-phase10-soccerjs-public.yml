name: PokéFC Phase 10 — Soccer-JS public overnight feasibility

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pokefc-phase10-soccerjs-public.yml"
      - "scripts/phase10-soccerjs-overnight.cjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pokefc-phase10-soccerjs-public
  cancel-in-progress: true

jobs:
  soccerjs-public:
    name: Public Soccer-JS mechanics and 60-match reliability audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out public simulation lab
        uses: actions/checkout@v4

      - name: Check out pinned open-source Soccer-JS
        uses: actions/checkout@v4
        with:
          repository: haeretici/soccer-js
          ref: 38970e0dade0865078c9e84bc1ecfd72aaa02fde
          path: upstream
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate existing Soccer-JS mechanics
        working-directory: upstream
        run: |
          set -euo pipefail
          node tests/match_fsm_gate.js
          node tests/match_rules_events.js
          node tests/replay_scrubber_test.js
          node tests/substitutions.js
          node tests/manual_control.js
          node tests/goal_entity.js

      - name: Baseline three formations and repeat seeded matches
        run: |
          node --check scripts/phase10-soccerjs-overnight.cjs
          node scripts/phase10-soccerjs-overnight.cjs upstream

      - name: Store report for next development chunk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase10-soccerjs-public-baseline-report
          path: phase10-reports/
          if-no-files-found: warn
          retention-days: 7
