name: PokéFC Quick Sim vs TacticMesh — matched-roster report
on:
  workflow_run:
    workflows: ['PokéFC matched Quick Sim reference — public TM fixtures']
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful public TacticMesh fixture workflow run ID'
        required: true
        type: string
        default: '41891406565'
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download public TacticMesh matched-roster fixture results
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: pokefc-shared-roster-tm-reference
          path: results/source
      - name: Validate exact rosters and compare with private Quick Sim numeric results
        run: |
          node --check scripts/compare-published-quick-reference.cjs
          node scripts/compare-published-quick-reference.cjs results/source config/quick-sim-v07b-matched-fixture-reference.json results/comparison
          cat results/comparison/matched-engine-comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Archive final per-fixture cross-engine comparison
        uses: actions/upload-artifact@v4
        with:
          name: pokefc-quick-vs-tacticmesh-matched-rosters
          path: results/comparison
          retention-days: 90
