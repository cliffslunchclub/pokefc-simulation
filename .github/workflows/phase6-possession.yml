name: Phase 6 possession A/B
on:
  push:
    branches: [main]
    paths: ['.github/workflows/phase6-possession.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        variant: [phase4-control, phase6-possession]
        seed: [920001, 920002, 920003, 920004, 920005]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and smoke test
        run: |
          node --check engines/tacticmesh/src/intelligence.js
          node --check engines/tacticmesh/src/physics.js
          node scripts/checkpoint-smoke.cjs
      - name: Run full match
        env:
          VARIANT: ${{ matrix.variant }}
          SEED: ${{ matrix.seed }}
        run: |
          mkdir -p results
          node engines/tacticmesh/tools/batch.cjs --matches 1 --seed "$SEED" --half-seconds 2700 --strength-profile independent --home-style balanced --away-style balanced --calibration-variant "$VARIANT" --out "results/phase6-possession-$VARIANT-$SEED.json"
      - uses: actions/upload-artifact@v4
        with:
          name: possession-${{ matrix.variant }}-${{ matrix.seed }}
          path: results/*.json
          retention-days: 90
