name: Phase 6 goalkeeper reach A/B
on:
  push:
    branches: [main]
    paths: ['.github/workflows/phase6-keeper.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        variant: [phase4-control, phase6-keeper-reach40]
        seed: [910001, 910002, 910003, 910004, 910005]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate engine
        run: node --check engines/tacticmesh/src/physics.js
      - name: Run full 90-minute match
        env:
          VARIANT: ${{ matrix.variant }}
          SEED: ${{ matrix.seed }}
        run: |
          mkdir -p results
          node engines/tacticmesh/tools/batch.cjs --matches 1 --seed "$SEED" --half-seconds 2700 --strength-profile independent --home-style balanced --away-style balanced --calibration-variant "$VARIANT" --out "results/phase6-$VARIANT-$SEED.json"
      - uses: actions/upload-artifact@v4
        with:
          name: phase6-${{ matrix.variant }}-${{ matrix.seed }}
          path: results/*.json
          retention-days: 90
