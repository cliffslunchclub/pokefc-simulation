name: PokéFC Phase 8 — defender pass interception reach (60 full matches)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pokefc-phase8-reach.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pokefc-phase8-reach
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate engine, telemetry and report scripts
        run: |
          node --check engines/tacticmesh/src/physics.js
          node --check engines/tacticmesh/src/intelligence.js
          node --check engines/tacticmesh/src/telemetry.js
          node --check engines/tacticmesh/tools/batch.cjs
          node --check scripts/summarize-phase8-reach.cjs
          node scripts/checkpoint-smoke.cjs
      - name: Smoke-test every variant and seed selection
        run: |
          mkdir -p results
          for variant in phase4-control phase8-reach15 phase8-reach25 phase8-reach40; do
            node engines/tacticmesh/tools/batch.cjs --matches 1 --seed 990001 --half-seconds 30 --calibration-variant "$variant" --out "results/$variant.json" > /dev/null
            node -e 'const r=require(process.argv[1]);if(r.calibrationVariant!==process.argv[2]||r.completedMatches!==1)process.exit(1)' "$(pwd)/results/$variant.json" "$variant"
          done
  trial:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        variant: [phase4-control, phase8-reach15, phase8-reach25, phase8-reach40]
        seed: [990001, 990006, 990011]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run five full-length matches
        env:
          VARIANT: ${{ matrix.variant }}
          SEED: ${{ matrix.seed }}
        run: |
          mkdir -p results
          node engines/tacticmesh/tools/batch.cjs --matches 5 --seed "$SEED" --half-seconds 2700 --strength-profile independent --home-style balanced --away-style balanced --calibration-variant "$VARIANT" --out "results/phase8-$VARIANT-$SEED.json" > /dev/null
          node -e 'const r=require(process.argv[1]);if(r.calibrationVariant!==process.argv[2]||r.completedMatches!==5||r.fullRegulation!==true||r.matchesData.some(m=>!m.finished||m.simulatedSeconds<5399))process.exit(1)' "$(pwd)/results/phase8-$VARIANT-$SEED.json" "$VARIANT"
      - name: Preserve full match results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-${{ matrix.variant }}-${{ matrix.seed }}
          path: results/phase8-*.json
          retention-days: 90
          if-no-files-found: warn
  summary:
    needs: [preflight, trial]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: phase8-*
          path: results/input
          merge-multiple: true
      - name: Generate matched-seed A/B report
        run: |
          node scripts/summarize-phase8-reach.cjs results/input results/phase8
          cat results/phase8/phase8-reach-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pokefc-phase8-reach-report
          path: results/phase8/
          retention-days: 90
          if-no-files-found: error
