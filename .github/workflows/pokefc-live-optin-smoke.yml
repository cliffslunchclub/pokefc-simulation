name: PokeFC — deployed opt-in 2.5D Quick Play smoke

on:
  push:
    branches: ["test/phase10-inline-2p5d"]
    paths:
      - ".github/workflows/pokefc-live-optin-smoke.yml"
      - "scripts/phase10-live-site-smoke.cjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pfc-live-optin-browser-smoke
  cancel-in-progress: true

jobs:
  hosted-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned public Soccer-JS test toolchain
        uses: actions/checkout@v4
        with:
          repository: haeretici/soccer-js
          ref: 38970e0dade0865078c9e84bc1ecfd72aaa02fde
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the same Playwright and Chromium toolchain as the passing 2.5D run
        working-directory: upstream
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Verify live SiteGround opt-in Watch via normal public browser
        env:
          PFC_SITE_URL: https://pfc.cliffslunchclub.com
        run: |
          node --check scripts/phase10-live-site-smoke.cjs
          NODE_PATH="$GITHUB_WORKSPACE/upstream/node_modules" node scripts/phase10-live-site-smoke.cjs
      - name: Upload read-only site proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfc-siteground-2p5d-live-smoke
          path: |
            phase10-reports/siteground-optin-smoke.json
            phase10-reports/siteground-optin-kickoff.png
          if-no-files-found: warn
          retention-days: 7
