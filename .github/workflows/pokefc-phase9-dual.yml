name: PokéFC Phase 9 — aggressive dual-engine calibration (300 TM / 108k Quick)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pokefc-phase9-dual.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pokefc-phase9-dual-300
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source, reporting and deterministic checkpoint
        run: |
          node --check engines/tacticmesh/src/physics.js
          node --check engines/tacticmesh/src/intelligence.js
          node --check engines/tacticmesh/tools/batch.cjs
          node --check scripts/summarize-phase9-dual.cjs
          node scripts/checkpoint-smoke.cjs
      - name: Check all Phase 9 variants can complete short real-physics games
        run: |
          mkdir -p results
          for variant in phase4-control phase9-dual-balanced phase9-dual-fortified phase9-dual-stabilized phase9-dual-reach55; do
            node engines/tacticmesh/tools/batch.cjs \
              --matches 1 --seed 993001 --half-seconds 45 \
              --strength-profile independent \
              --home-style balanced --away-style balanced \
              --home-rating-offset 0 --away-rating-offset 0 \
              --calibration-variant "$variant" \
              --include-quick-sim-fixtures \
              --out "results/$variant-smoke.json" > /dev/null
            VARIANT="$variant" node -e 'const fs=require("node:fs");const f=JSON.parse(fs.readFileSync("results/"+process.env.VARIANT+"-smoke.json","utf8"));const x=f.matchesData[0].quickSimFixture;if(f.completedMatches!==1||x.home.lineup.length!==11||x.away.lineup.length!==11)process.exit(1);const ref=JSON.parse(fs.readFileSync("config/phase9-quick-sim-numeric-reference.json","utf8"));const expected=ref.fixtures.find(y=>y.variant===process.env.VARIANT&&y.profile==="avg-avg"&&y.seed===993001);let h=2166136261;for(const c of JSON.stringify(x))h=Math.imul(h^c.charCodeAt(0),16777619)>>>0;const actual=h.toString(16).padStart(8,"0");if(actual!==expected?.rosterFingerprint)throw Error("Matched roster fingerprint mismatch: "+process.env.VARIANT+" "+actual+" != "+expected?.rosterFingerprint);'
          done
  experiment:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        variant: [phase4-control, phase9-dual-balanced, phase9-dual-fortified, phase9-dual-stabilized, phase9-dual-reach55]
        profile: [avg-avg, weak-weak, elite-elite, elite-weak]
        seed: [993001, 993006, 993011]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 5 genuine full 90-minute physics matches using rated starting XIs
        env:
          VARIANT: ${{ matrix.variant }}
          PROFILE: ${{ matrix.profile }}
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          case "$PROFILE" in
            avg-avg) HOME_OFFSET=0; AWAY_OFFSET=0 ;;
            weak-weak) HOME_OFFSET=-15; AWAY_OFFSET=-15 ;;
            elite-elite) HOME_OFFSET=15; AWAY_OFFSET=15 ;;
            elite-weak) HOME_OFFSET=15; AWAY_OFFSET=-15 ;;
            *) echo "Unknown strength profile $PROFILE"; exit 1 ;;
          esac
          mkdir -p results
          FILE="results/tm-phase9-$VARIANT-$PROFILE-$SEED.json"
          node engines/tacticmesh/tools/batch.cjs \
            --matches 5 --seed "$SEED" --half-seconds 2700 \
            --strength-profile independent \
            --home-style balanced --away-style balanced \
            --home-rating-offset "$HOME_OFFSET" --away-rating-offset "$AWAY_OFFSET" \
            --calibration-variant "$VARIANT" \
            --include-quick-sim-fixtures --out "$FILE" > /dev/null
          FILE="$FILE" VARIANT="$VARIANT" node -e 'const x=require("node:fs");const f=JSON.parse(x.readFileSync(process.env.FILE,"utf8"));if(f.calibrationVariant!==process.env.VARIANT||!f.fullRegulation||f.completedMatches!==5||f.matchesData.length!==5||f.matchesData.some(m=>!m.finished||m.simulatedSeconds<5399))process.exit(1);'
      - name: Save exact player rosters and every genuine match report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tm-phase9-${{ matrix.variant }}-${{ matrix.profile }}-${{ matrix.seed }}
          path: results/tm-phase9-*.json
          retention-days: 90
          if-no-files-found: warn
  report:
    needs: [preflight,experiment]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: tm-phase9-*
          path: results/input
          merge-multiple: true
      - name: Verify 300 exact-player matched pairs and compare engines
        run: |
          node scripts/summarize-phase9-dual.cjs results/input config/phase9-quick-sim-numeric-reference.json results/final
          cat results/final/phase9-dual-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Archive matched statistics, scenarios and ranking
        uses: actions/upload-artifact@v4
        with:
          name: pokefc-phase9-dual-engine-calibration
          path: results/final/
          retention-days: 90
          if-no-files-found: error
