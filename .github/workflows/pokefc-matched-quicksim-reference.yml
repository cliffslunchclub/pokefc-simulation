name: PokéFC matched Quick Sim reference — public TM fixtures
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pokefc-matched-quicksim-reference.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pokefc-matched-quicksim-reference
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate snapshot exporter and checkpoint
        run: |
          node --check engines/tacticmesh/tools/batch.cjs
          node --check scripts/compare-quicksim-tm.cjs
          node --check scripts/summarize-tm-reference.cjs
          node scripts/checkpoint-smoke.cjs
      - name: Verify one exported shared fixture
        run: |
          node engines/tacticmesh/tools/batch.cjs --matches 1 --seed 991101 --half-seconds 30 --calibration-variant phase4-control --strength-profile independent --home-style balanced --away-style balanced --home-rating-offset 15 --away-rating-offset -15 --include-quick-sim-fixtures --out fixture.json > /dev/null
          node -e 'const f=require("./fixture.json");const p=f.matchesData[0].quickSimFixture;if(!f.includesQuickSimFixtures||p.home.lineup.length!==11||p.away.lineup.length!==11||!p.home.lineup[0].main.reflexes)process.exit(1);console.log("same 22 players exported successfully");'
  simulate:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [991101, 991102, 991103, 991104]
        include:
          - profile: avg-avg
            home_offset: 0
            away_offset: 0
          - profile: weak-weak
            home_offset: -15
            away_offset: -15
          - profile: elite-elite
            home_offset: 15
            away_offset: 15
          - profile: elite-weak
            home_offset: 15
            away_offset: -15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full 90-minute watched match with shared rated players
        env:
          SEED: ${{ matrix.seed }}
          PROFILE: ${{ matrix.profile }}
          HOME_OFFSET: ${{ matrix.home_offset }}
          AWAY_OFFSET: ${{ matrix.away_offset }}
        run: |
          mkdir -p results
          node engines/tacticmesh/tools/batch.cjs --matches 1 --seed "$SEED" --half-seconds 2700 --strength-profile independent --home-style balanced --away-style balanced --calibration-variant phase4-control --home-rating-offset "$HOME_OFFSET" --away-rating-offset "$AWAY_OFFSET" --include-quick-sim-fixtures --out "results/tm-reference-$PROFILE-$SEED.json" > /dev/null
          node -e 'const x=require(process.argv[1]);if(x.completedMatches!==1||!x.fullRegulation||!x.includesQuickSimFixtures||!x.matchesData[0].finished)process.exit(1)' "$(pwd)/results/tm-reference-$PROFILE-$SEED.json"
      - uses: actions/upload-artifact@v4
        with:
          name: tm-reference-${{ matrix.profile }}-${{ matrix.seed }}
          path: results/tm-reference-*.json
          retention-days: 90
  report:
    needs: simulate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: tm-reference-*
          path: results/input
          merge-multiple: true
      - name: Aggregate watched-match side of comparison
        run: |
          node scripts/summarize-tm-reference.cjs results/input results/tm-reference-summary.md
          cat results/tm-reference-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pokefc-shared-roster-tm-reference
          path: |
            results/input/*.json
            results/tm-reference-summary.md
          retention-days: 90
