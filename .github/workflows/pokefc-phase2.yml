name: PokéFC Phase 2 — 100-match TacticMesh benchmark

on:
  push:
    branches: [main]
    paths: ['.github/workflows/pokefc-phase2.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pokefc-phase2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scripts and checkpoint determinism
        run: |
          node --check scripts/summarize-phase2.cjs
          node --check engines/tacticmesh/tools/batch.cjs
          node --check engines/tacticmesh/src/telemetry.js
          node scripts/checkpoint-smoke.cjs
      - name: Verify instrumented tackle counters and profile flags
        run: |
          mkdir -p results
          node engines/tacticmesh/tools/batch.cjs --matches 1 --seed 860000 --half-seconds 90 --strength-profile equal --out results/preflight.json > /dev/null
          node -e 'const r=require("./results/preflight.json"); const m=r.matchesData[0]; if(r.strengthProfile!=="equal" || r.completedMatches!==1) throw Error("Profile preflight failed"); for(const t of Object.values(m.teams)){const c=t.counters; if(c.tackle!==(c.tackleSuccess+c.tackleFailure+c.tackleUnknown)) throw Error("Tackle audit mismatch")}'

  batch:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - { id: '01-equal-1', seed: 860001, profile: equal, home: balanced, away: balanced }
          - { id: '02-equal-2', seed: 860006, profile: equal, home: press, away: balanced }
          - { id: '03-equal-3', seed: 860011, profile: equal, home: possession, away: direct }
          - { id: '04-equal-4', seed: 860016, profile: equal, home: direct, away: possession }
          - { id: '05-home-strong-1', seed: 860021, profile: home-strong, home: balanced, away: balanced }
          - { id: '06-home-strong-2', seed: 860026, profile: home-strong, home: press, away: balanced }
          - { id: '07-home-strong-3', seed: 860031, profile: home-strong, home: possession, away: direct }
          - { id: '08-home-strong-4', seed: 860036, profile: home-strong, home: direct, away: possession }
          - { id: '09-away-strong-1', seed: 860041, profile: away-strong, home: balanced, away: balanced }
          - { id: '10-away-strong-2', seed: 860046, profile: away-strong, home: press, away: balanced }
          - { id: '11-away-strong-3', seed: 860051, profile: away-strong, home: possession, away: direct }
          - { id: '12-away-strong-4', seed: 860056, profile: away-strong, home: direct, away: possession }
          - { id: '13-independent-1', seed: 860061, profile: independent, home: balanced, away: balanced }
          - { id: '14-independent-2', seed: 860066, profile: independent, home: press, away: balanced }
          - { id: '15-independent-3', seed: 860071, profile: independent, home: possession, away: direct }
          - { id: '16-independent-4', seed: 860076, profile: independent, home: direct, away: possession }
          - { id: '17-generated-1', seed: 860081, profile: generated, home: generated, away: generated }
          - { id: '18-generated-2', seed: 860086, profile: generated, home: generated, away: generated }
          - { id: '19-generated-3', seed: 860091, profile: generated, home: generated, away: generated }
          - { id: '20-generated-4', seed: 860096, profile: generated, home: generated, away: generated }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Five 90-minute matches with reproducible seeds
        env:
          SEED: ${{ matrix.seed }}
          PROFILE: ${{ matrix.profile }}
          HOME: ${{ matrix.home }}
          AWAY: ${{ matrix.away }}
          ID: ${{ matrix.id }}
        run: |
          mkdir -p results
          node engines/tacticmesh/tools/batch.cjs --matches 5 --seed "$SEED" --half-seconds 2700 --strength-profile "$PROFILE" --home-style "$HOME" --away-style "$AWAY" --out "results/batch-${ID}.json" > /dev/null
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1])); if(r.completedMatches!==5||!r.fullRegulation||r.strengthProfile!==process.argv[2])throw Error("Incomplete or mislabeled batch"); for(const m of r.matchesData)if(!m.finished||m.simulatedSeconds<5399)throw Error("Incomplete match "+m.seed); console.log("PASS",r.strengthProfile,r.matchesData.map(m=>m.seed).join(","))' "results/batch-${ID}.json" "$PROFILE"
      - name: Save batch results (even after failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-${{ matrix.id }}
          path: results/batch-*.json
          if-no-files-found: warn
          retention-days: 90

  summary:
    if: always()
    needs: [preflight, batch]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: phase2-*
          path: results/input
          merge-multiple: true
      - name: Aggregate and audit 100 full matches
        run: |
          node scripts/summarize-phase2.cjs results/input results/phase2
          cat results/phase2/phase2-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save complete statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokefc-phase2-100-match-report
          path: results/phase2/
          if-no-files-found: warn
          retention-days: 90
